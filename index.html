<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema WSS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      .card-agenda {
        border-left: 5px solid #0d6efd;
        transition: 0.2s;
      }

      .card-agenda:hover {
        transform: translateY(-2px);
      }

      .itens-agenda {
        white-space: pre-line;
      }
    </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="card shadow">
      <div class="card-header">
        <h3 class="mb-0">🛋️ Sistema WSS</h3>
      </div>

      <div class="card-body">
        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="pills-agenda-tab" data-bs-toggle="pill" data-bs-target="#pills-agenda" type="button" role="tab" aria-controls="pills-agenda" aria-selected="true">Agenda</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-orcamento-tab" data-bs-toggle="pill" data-bs-target="#pills-orcamento" type="button" role="tab" aria-controls="pills-orcamento" aria-selected="true">Orçamento</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-agendamento-tab" data-bs-toggle="pill" data-bs-target="#pills-agendamento" type="button" role="tab" aria-controls="pills-agendamento" aria-selected="false">Agendamento</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-estoque-tab" data-bs-toggle="pill" data-bs-target="#pills-estoque" type="button" role="tab" aria-controls="pills-estoque" aria-selected="false">Estoque</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-catalogo-tab" data-bs-toggle="pill" data-bs-target="#pills-catalogo" type="button" role="tab" aria-controls="pills-catalogo" aria-selected="false">Catálogo</button>
          </li>
        </ul>
        
        <div class="tab-content" id="pills-tabContent">
          <div class="tab-pane fade show active" id="pills-agenda" role="tabpanel">
            <div id="listaAgenda" class="row g-3"></div>
          </div>

          <div class="tab-pane fade" id="pills-orcamento" role="tabpanel" aria-labelledby="pills-orcamento-tab" tabindex="1">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Item:</label>
                <select id="item" class="form-select"></select>
              </div>

              <div class="col-md-4 d-grid">
                <label class="form-label">&nbsp;</label>
                <button class="btn btn-primary" onclick="adicionarItemOrcamento()">Adicionar Item</button>
              </div>
            </div>
            <hr/>

            <h5>Itens adicionados:</h5>
            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th width="180">Valor</th>
                    <th width="200">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabelaItens"></tbody>
              </table>
            </div>
      
            <h4 class="mt-3">Total: <span id="total">R$ 0,00</span></h4>
            <hr/>

            <div class="d-grid gap-2">
              <button class="btn btn-success" onclick="gerarMensagemOrcamento()">Gerar Orçamento</button>
              <button class="btn btn-secondary" onclick="copiarTexto('resultado')">Copiar Texto</button>
              <button class="btn btn-danger" onclick="limparTexto('resultado')">Limpar</button>
            </div>
            
            <div class="mt-4">
              <textarea id="resultado" class="form-control" rows="15"></textarea>
            </div>
          </div>
      
          <div class="tab-pane fade" id="pills-agendamento" role="tabpanel" aria-labelledby="pills-agendamento-tab" tabindex="2">
            <div class="d-grid gap-2 mt-4">
              <button class="btn btn-primary" onclick="gerarSolicitacaoDados()">Solicitar Dados ao Cliente</button>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome:</label>
                  <input id="agNome" class="form-control">
                </div>

                <div class="col-md-3">
                  <label class="form-label">CPF:</label>
                  <input id="agCPF" class="form-control" maxlength="14" oninput="formatarCPF(event)">

                </div>
                <div class="col-md-3">
                  <label class="form-label">Telefone:</label>
                  <input id="agTelefone" class="form-control" maxlength="15" oninput="formatarTelefone(event)">
                </div>

                <div class="col-md-3">
                  <label class="form-label">CEP:</label>
                  <input id="agCEP" class="form-control" maxlength="9" oninput="formatarCEP(event)" onblur="buscarCEP()">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Endereço:</label>
                  <input id="agEndereco" class="form-control">

                  <button class="btn btn-info" onclick="abrirMaps()" style="margin-top: 10px;">Ver no Maps</button>
                </div>

                <div class="col-md-1">
                  <label class="form-label">Número:</label>
                  <input id="agNumero" class="form-control">
                </div>

                <div class="col-md-2">
                  <label class="form-label">Complemento:</label>
                  <input id="agComplemento" class="form-control">
                </div>

                <div class="col-md-2">
                  <label class="form-label">Data:</label>
                  <input id="agData" type="date" class="form-control">
                </div>

                <div class="col-md-2">
                  <label class="form-label">Horário:</label>
                  <select id="agHora" class="form-select">
                    <option value="">Selecione...</option>
                    <option value="08:00">08:00</option>
                    <option value="08:30">08:30</option>
                    <option value="09:00">09:00</option>
                    <option value="09:30">09:30</option>
                    <option value="10:00">10:00</option>
                    <option value="10:30">10:30</option>
                    <option value="11:00">11:00</option>
                    <option value="11:30">11:30</option>
                    <option value="12:00">12:00</option>
                    <option value="12:30">12:30</option>
                    <option value="13:00">13:00</option>
                    <option value="13:30">13:30</option>
                    <option value="14:00">14:00</option>
                    <option value="14:30">14:30</option>
                    <option value="15:00">15:00</option>
                    <option value="15:30">15:30</option>
                    <option value="16:00">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17:00">17:00</option>
                  </select>
                </div>
              </div>

              <button class="btn btn-success" onclick="gerarConfirmacaoAgendamento()">Confirmar Agendamento</button>
              <button class="btn btn-secondary" onclick="copiarTexto('mensagem-agendamento')">Copiar Texto</button>
              <button class="btn btn-danger" onclick="limparTexto('mensagem-agendamento')">Limpar</button>

              <div class="mt-4">
                <textarea id="mensagem-agendamento" class="form-control" rows="15"></textarea>      
              </div>
            </div>
          </div>

          <div class="tab-pane fade" id="pills-estoque" role="tabpanel" aria-labelledby="pills-estoque-tab" tabindex="3">
            <div class="card mb-3">
              <div class="card-body">
                <div class="row g-3">

                  <div class="col-md-5">
                    <label class="form-label">Produto</label>
                    <select class="form-select" id="movProduto" onchange="atualizarPlaceholderQuantidadeEstoque()">
                    </select>
                  </div>

                  <div class="col-md-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" id="movQuantidade" class="form-control" min="1" step="1">
                  </div>

                  <div class="col-md-4 d-flex align-items-end gap-2">
                    <button class="btn btn-danger w-100" onclick="saidaEstoque()">
                      <i class="bi bi-dash-lg"></i>
                      Remover
                    </button>
                    <button class="btn btn-success w-100" onclick="entradaEstoque()">
                      <i class="bi bi-plus-lg"></i>
                      Adicionar
                    </button>
                  </div>

                </div>
              </div>
            </div>

            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Estoque Atual</th>
                </tr>
              </thead>
              <tbody id="tbodyEstoque"></tbody>
            </table>
          </div>

          <div class="tab-pane fade" id="pills-catalogo" role="tabpanel" aria-labelledby="pills-catalogo-tab" tabindex="4">
              <div class="card mb-3">
                <div class="card-body">

                  <div class="row g-3">

                    <div class="col-md-8">
                      <label class="form-label">
                        Item
                      </label>

                      <input
                        type="text"
                        id="novoItem"
                        class="form-control">
                    </div>

                    <div class="col-md-4">
                      <label class="form-label">
                        Valor
                      </label>

                      <input
                        type="number"
                        id="novoValor"
                        class="form-control"
                        step="0.01">
                    </div>

                    <div class="col-md-12 d-grid">
                      <button
                        class="btn btn-success"
                        onclick="adicionarItemCatalogo()">
                        Adicionar Item
                      </button>
                    </div>

                  </div>

                </div>
              </div>

              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Valor</th>
                    <th width="250">
                      Ações
                    </th>
                  </tr>
                </thead>

                <tbody id="tbodyCatalogo"></tbody>
              </table>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>

<script>

  const SUPABASE_URL = 'https://uafzfedbopforaqookrd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5szoir4Z1GhW3YF8Qartxg_vj7_yD8n';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Inicialização da página
  window.onload = async function () {
    await carregarCatalogo();
    await carregarEstoque();
    await carregarAgenda();
    atualizarTabelaOrcamento();
  };

  // Variáveis globais

  let itensOrcamento = [];

  let ultimoOrcamento = {
    total: 0,
    valor3: '',
    valor4: '',
    valor5: '',
    itens: ''
  };

  let logradouro = '';
  let bairro = '';
  let cidade = '';
  let uf = '';

  let catalogo = {};
  let estoque = {};
  let agenda = [];

  // Funções auxiliares

  function moeda(valor) {
    return valor.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
  }

  async function carregarCatalogo() {
    const { data, error } = await supabaseClient.from('catalogo').select('*').order('nome');

    if (error) {
      console.error(error);
      alert('Erro ao carregar catálogo.');
      return;
    }

    catalogo = {};

    const select = document.getElementById('item');
    select.innerHTML = '<option value="" selected disabled>Selecione um item...</option>';

    data.forEach(item => {
      catalogo[item.nome] = Number(item.valor);

      const option = document.createElement('option');
      option.value = item.nome;
      option.textContent = item.nome;
      select.appendChild(option);
    });

    atualizarTabelaCatalogo();
  }

  async function carregarEstoque() {
    const { data, error } = await supabaseClient
      .from('estoque')
      .select('*')
      .order('produto');

    if (error) {
      console.error(error);
      alert('Erro ao carregar estoque.');
      return;
    }

    data.forEach(item => {
      estoque[item.produto] = {
        quantidade: Number(item.quantidade),
        unidade: item.unidade
      };
    });

    atualizarTabelaEstoque();
    atualizarSelectEstoque();
  }

  async function carregarAgenda() {
    const { data, error } = await supabaseClient.from('agenda').select('*').eq('finalizado', false).order('data').order('horario');

    if (error) {
      console.error(error);
      return;
    }

    agenda = data;
    atualizarTabelaAgenda();
  }

  function adicionarItemOrcamento() {
    const nome = document.getElementById('item').value;

    if (!nome) {
      alert('Selecione um item.');
      return;
    }

    itensOrcamento.push({
      nome,
      valor: catalogo[nome]
    });
    atualizarTabelaOrcamento();
  }

  function removerItemOrcamento(indice) {
    itensOrcamento.splice(indice, 1);
    atualizarTabelaOrcamento();
  }

  function editarValorOrcamento(indice) {
    const novoValor = prompt('Novo valor:', itensOrcamento[indice].valor.toFixed(2));

    if (novoValor === null) {
      return;
    }

    const valor = parseFloat(novoValor.replace(',', '.'));

    if (isNaN(valor)) {
      alert('Valor inválido.');
      return;
    }

    itensOrcamento[indice].valor = valor;
    atualizarTabelaOrcamento();
  }

  function formatarCPF(event) {
    let valor = event.target.value.replace(/\D/g, '');

    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

    event.target.value = valor;
  }

  function formatarTelefone(event) {
    let valor = event.target.value.replace(/\D/g, '');

    if (valor.length <= 10) {
      valor = valor.replace(/(\d{2})(\d)/, '($1) $2');
      valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
    }
    else {
      valor = valor.replace(/(\d{2})(\d)/, '($1) $2');
      valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
    }

    event.target.value = valor;
  }

  function atualizarTabelaOrcamento() {
    const tbody = document.getElementById('tabelaItens');
    tbody.innerHTML = '';
    let total = 0;

    itensOrcamento.forEach((item, indice) => {
      total += item.valor;
      tbody.innerHTML += `
        <tr>
          <td>${item.nome}</td>
          <td>${moeda(item.valor)}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="editarValorOrcamento(${indice})">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="removerItemOrcamento(${indice})">Remover</button>
          </td>
        </tr>
      `;
    });
    document.getElementById('total').innerText = moeda(total);
  }

  function calcularValor(valor, parcelas) {
    const taxaVenda = 2.99;
    const taxas = {
      1: 4.98,
      2: 6.91,
      3: 8.29,
      4: 9.65,
      5: 10.98
    };
    const taxa = taxaVenda + taxas[parcelas];
    return valor / (1 - taxa / 100);
  }

  function gerarMensagemOrcamento() {
    if (itensOrcamento.length === 0) {
      alert('Adicione pelo menos um item no Orçamento!');
      return;
    }

    const total = itensOrcamento.reduce((soma, item) => soma + item.valor, 0);
    const agrupados = {};

    itensOrcamento.forEach(item => {
      const chave = `${item.nome}-${item.valor}`;

      if (!agrupados[chave]) {
        agrupados[chave] = {
          nome: item.nome,
          quantidade: 0
        };
      }
      agrupados[chave].quantidade++;
    });

    const itensSelecionados = Object.values(agrupados).map(item => {
      if (item.quantidade > 1) {
        return `• ${item.nome} (${item.quantidade}x)`;
      }

      return `• ${item.nome}`;
    }).join('\n');

    const valor1 = (calcularValor(total, 1) / 1).toFixed(2);
    const valor2 = (calcularValor(total, 2) / 2).toFixed(2);
    const valor3 = (calcularValor(total, 3) / 3).toFixed(2);
    const valor4 = (calcularValor(total, 4) / 4).toFixed(2);
    const valor5 = (calcularValor(total, 5) / 5).toFixed(2);

    ultimoOrcamento = {
      total: total,
      valor1: valor1,
      valor2: valor2,
      valor3: valor3,
      valor4: valor4,
      valor5: valor5,
      itens: itensSelecionados
    };

    const data = new Date().toLocaleDateString('pt-BR');
    const texto = 
`🛋️ *ORÇAMENTO ${(data)}*

O nosso serviço é profissional, seguro e especializado.

Sabemos que receber alguém em casa exige *confiança*. Por isso, contamos com um técnico altamente capacitado para garantir um *resultado impecável*, além de um atendimento que te acompanha do agendamento até a finalização do serviço.

Nosso objetivo é simples: entregar *qualidade*, *segurança* e um *resultado* que te faça querer contar conosco sempre que precisar. 😊

*Abaixo segue o orçamento.*

*Itens solicitados:*

${itensSelecionados}

💳 *Parcelamento no cartão de crédito*
3x de R$ ${valor3}
4x de R$ ${valor4}
5x de R$ ${valor5}

💰 *Oferta à vista*
R$ ${total.toFixed(2)} no PIX ou dinheiro`;
  document.getElementById('resultado').value = texto;
  }

  function copiarTexto(element_id) {
    const texto = document.getElementById(element_id);
    texto.select();
    navigator.clipboard.writeText(texto.value);
  }

  function limparTexto(element_id) {
    document.getElementById(element_id).value = '';

    if (element_id === 'resultado') {
      itensOrcamento = [];
      atualizarTabelaOrcamento();
    }
  }

  function gerarSolicitacaoDados() {
    const texto =
`Para prosseguirmos com o agendamento, por favor, nos envie as seguintes informações:

Nome completo:
CPF:
Endereço completo:
CEP:

Após o envio dos dados, retornaremos com a confirmação do agendamento. 😊`;

  document.getElementById('mensagem-agendamento').value = texto;
  }

  function gerarConfirmacaoAgendamento() {
    const nome = document.getElementById('agNome').value;
    const cpf = document.getElementById('agCPF').value;
    const telefone = document.getElementById('agTelefone').value;
    const cep = document.getElementById('agCEP').value;
    const data = document.getElementById('agData').value;
    const hora = document.getElementById('agHora').value;

    const numero = document.getElementById('agNumero').value;
    const complemento = document.getElementById('agComplemento').value;
    const endereco = `${logradouro}, ${numero}, ${complemento}, ${bairro} - ${cidade}/${uf} (CEP: ${cep})`;
    
    const link_maps = `${logradouro}, ${numero}, ${bairro} - ${cidade}/${uf} (CEP: ${cep})`;

    if (!nome || !cpf || !telefone || !endereco || !cep || !data || !hora || !ultimoOrcamento.itens) {
      alert('Atenção! Gere o orçamento antes e preencha todos os dados do cliente.');
      return;
    }

    const dataFormatada = new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');

    const linkMaps =`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(link_maps)}`;

  const texto =
`Seu agendamento foi confirmado!

Data: ${dataFormatada} ${hora}

*Itens:*
${ultimoOrcamento.itens}

Nome: ${nome}
CPF: ${cpf}
Telefone: ${telefone}

📍 Endereço: ${endereco}
🗺️ ${linkMaps}

*Informações de Pagamento:*

*💳 Parcelamento no cartão de crédito*
1x de R$ ${ultimoOrcamento.valor1}
2x de R$ ${ultimoOrcamento.valor2}
3x de R$ ${ultimoOrcamento.valor3}
4x de R$ ${ultimoOrcamento.valor4}
5x de R$ ${ultimoOrcamento.valor5}

*💰 À vista:*
R$ ${ultimoOrcamento.total.toFixed(2)} no PIX ou dinheiro`;

  document.getElementById('mensagem-agendamento').value = texto;

  salvarAgendamento(nome, cpf, telefone, endereco, data, hora, ultimoOrcamento, linkMaps);
  }

  function formatarCEP(event) {
    let valor = event.target.value.replace(/\D/g, '');
    valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
    event.target.value = valor;
  }

  async function buscarCEP() {
    const cep = document.getElementById('agCEP').value.replace(/\D/g, '');

    if (cep.length !== 8) {
      return;
    }

    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const dados = await resposta.json();

    if (dados.erro) {
      alert('CEP não encontrado.');
      return;
    }

    logradouro = dados.logradouro;
    bairro = dados.bairro;
    cidade = dados.localidade;
    uf = dados.uf;

    document.getElementById('agEndereco').value = `${logradouro}, ${bairro} - ${cidade} / ${uf}`;
  }

  function abrirMaps() {
    const numero = document.getElementById('agNumero').value;
    const cep = document.getElementById('agCEP').value;
    const link_maps = `${logradouro}, ${numero}, ${bairro} - ${cidade}/${uf} (CEP: ${cep})`

    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(link_maps)}`, '_blank');
  }

  async function updateProdutoEstoque(produto, quantidade) {
    const { error } = await supabaseClient.from('estoque').update({quantidade: quantidade}).eq('produto', produto);

    if (error) {
      console.error(error);
      alert('Erro ao salvar estoque.');
    }
  }

  function atualizarPlaceholderQuantidadeEstoque() {
    const produto = document.getElementById('movProduto').value;
    const unidade = estoque[produto]?.unidade || '';

    document.getElementById('movQuantidade').placeholder = `Quantidade em ${unidade}`;
  }
  
  async function entradaEstoque() {
    const produto = document.getElementById('movProduto').value;

    const quantidade = parseInt(document.getElementById('movQuantidade').value, 10);

    if (!quantidade || quantidade <= 0) {
      alert('Informe uma quantidade válida.');
      return;
    }

    const estoqueAtual = estoque[produto].quantidade || 0;

    const novaQuantidade = estoqueAtual + quantidade;
    estoque[produto].quantidade = novaQuantidade;

    await updateProdutoEstoque(produto, novaQuantidade);

    await carregarEstoque();

    document.getElementById('movQuantidade').value = '';
  }

  async function saidaEstoque() {
    const produto = document.getElementById('movProduto').value;
    const quantidade = parseInt(document.getElementById('movQuantidade').value, 10);

    if (!quantidade || quantidade <= 0) {
      alert('Informe uma quantidade válida.');
      return;
    }

    const estoqueAtual = estoque[produto].quantidade || 0;

    if (estoqueAtual < quantidade) {
      alert('Estoque insuficiente.');
      return;
    }

    const novaQuantidade = estoqueAtual - quantidade;

    estoque[produto].quantidade = novaQuantidade;

    await updateProdutoEstoque(produto, novaQuantidade);

    await carregarEstoque();

    document.getElementById('movQuantidade').value = '';
  }

  function atualizarTabelaEstoque() {
    const tbody = document.getElementById('tbodyEstoque' );
    tbody.innerHTML = '';

    Object.keys(estoque).forEach(produto => {
      const item = estoque[produto];

      tbody.innerHTML += `
        <tr>
          <td>${produto}</td>
          <td>
            ${formatarQuantidade(item.quantidade, item.unidade)}
          </td>
        </tr>
      `;
      }
    );
  }

  function formatarQuantidade(quantidade, unidade) {
    if (unidade === 'ml' && quantidade >= 1000) {
      const litros = quantidade / 1000;
      return `${litros.toLocaleString('pt-BR')} L`;
    }

    if (unidade === 'g' && quantidade >= 1000) {
      const kg = quantidade / 1000;
      return `${kg.toLocaleString('pt-BR')} KG`;
    }

    return `${quantidade} ${unidade}`;
  }

  function atualizarTabelaCatalogo() {
    const tbody = document.getElementById('tbodyCatalogo');
    tbody.innerHTML = '';

    Object.keys(catalogo).sort().forEach(nome => {
      tbody.innerHTML += `
        <tr>
          <td>${nome}</td>
          <td>${moeda(catalogo[nome])}</td>
          <td>

            <button
              class="btn btn-warning btn-sm"
              onclick="editarItemCatalogo('${nome}')">
              Editar
            </button>

            <button
              class="btn btn-danger btn-sm"
              onclick="removerItemCatalogo('${nome}')">
              Excluir
            </button>

          </td>
        </tr>
      `;
      });
  }

  function atualizarSelectEstoque() {
    const select = document.getElementById('movProduto');

    select.innerHTML = '<option value="" selected disabled>Selecione um produto...</option>';

    Object.keys(estoque).forEach(produto => {
      select.innerHTML += `<option value="${produto}">${produto}</option>`;
    });
  }

  async function adicionarItemCatalogo() {
    const nome = document.getElementById('novoItem').value.trim();
    const valor = parseFloat(document.getElementById('novoValor').value);

    if (!nome || isNaN(valor)) {
      alert('Preencha todos os campos.');
      return;
    }

    const { error } = await supabaseClient.from('catalogo').insert({nome, valor});

    if (error) {
      console.error(error);
      alert('Erro ao adicionar.');
      return;
    }

    document.getElementById('novoItem').value = '';
    document.getElementById('novoValor').value = '';

    await carregarCatalogo();
  }

  async function editarItemCatalogo(nome) {
    const valorAtual = catalogo[nome];
    const novoValor = prompt('Novo valor:',valorAtual);

    if (novoValor === null) {
      return;
    }

    const valor = parseFloat(novoValor.replace(',', '.'));

    if (isNaN(valor)) {
      alert('Valor inválido.');
      return;
    }

    const { error } = await supabaseClient.from('catalogo').update({valor}).eq('nome', nome);

    if (error) {
      console.error(error);
      return;
    }

    await carregarCatalogo();
  }

  async function removerItemCatalogo(nome) {
    if (!confirm(`Excluir "${nome}"?`)) {
      return;
    }

    const { error } = await supabaseClient.from('catalogo').delete().eq('nome', nome);

    if (error) {
      console.error(error);
      return;
    }

    await carregarCatalogo();
  }

  function atualizarTabelaAgenda() {
    const lista = document.getElementById('listaAgenda');
    lista.innerHTML = '';

    if (agenda.length === 0) {
      lista.innerHTML = `
        <div class="col-12">
          <div class="alert alert-light border text-center">
            Nenhum serviço agendado.
          </div>
        </div>
      `;
      return;
    }

    agenda.forEach(item => {
      const data = new Date(item.data + 'T00:00:00').toLocaleDateString('pt-BR');

      lista.innerHTML += `
        <div class="col-md-6">
          <div class="card shadow-sm card-agenda h-100">
            <div class="card-body">
              <h6 class="card-title">📅 ${data} às ${item.horario}</h6>
              <p class="mb-1"><strong>${item.nome}</strong></p>
              <p class="mb-1">${item.telefone}</p>
              <p class="mb-3">${item.endereco}</p>
              <button class="btn btn-primary btn-sm" onclick="window.open('${item.link_maps}', '_blank' )">Ver Mapa</button>
              <hr/>
              <div class="mb-3">
                <strong>Itens:</strong>
                <div class="itens-agenda">
                  ${item.orcamento.itens}
                </div>
              </div>

              <label><strong>Parcelamento no cartão de crédito:</strong></label>
              <table>
                <tr><td>1x de R$ ${item.orcamento.valor1}</td></tr>
                <tr><td>2x de R$ ${item.orcamento.valor2}</td></tr>
                <tr><td>3x de R$ ${item.orcamento.valor3}</td></tr>
                <tr><td>4x de R$ ${item.orcamento.valor4}</td></tr>
                <tr><td>5x de R$ ${item.orcamento.valor5}</td></tr>
              </table>
              </br>
              <label><strong>Valor à vista:</strong></label>
              <table>
                <tr><td>R$ ${item.orcamento.total} no PIX ou Dinheiro</td></tr>
              </table>

              <div class="d-flex gap-2">
                <button class="btn btn-danger btn-sm" onclick="cancelarAgendamento(${item.id})">Cancelar</button>
                <button class="btn btn-success btn-sm" onclick="finalizarServico(${item.id})">Finalizar</button>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }

  async function salvarAgendamento(nome, cpf, telefone, endereco, data, hora, orcamento, linkMaps) {
    const { error } = await supabaseClient.from('agenda').insert({nome, telefone, endereco, data, horario: hora, orcamento, link_maps: linkMaps});

    if (error) {
      console.error(error);
      return;
    }

    await carregarAgenda();
  }

  async function cancelarAgendamento(id) {
    if (!confirm('Cancelar agendamento?')) {
      return;
    }

    const { error } = await supabaseClient.from('agenda').delete().eq('id', id);

    if (error) {
      console.error(error);
      return;
    }

    await carregarAgenda();
  }

  async function finalizarServico(id) {
    if (!confirm('Finalizar Serviço?')) {
      return;
    }

    const { error } = await supabaseClient.from('agenda').update({finalizado: true}).eq('id', id);

    if (error) {
      console.error(error);
      return;
    }

    await carregarAgenda();
  }

</script>
</html>
